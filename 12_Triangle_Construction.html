<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Κατασκευή Τριγώνου – GeoGebra</title>

  <script src="https://www.geogebra.org/apps/deployggb.js"></script>

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 16px 12px;
    }

    header {
      text-align: center;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 3px;
      font-size: 1.65rem;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 900px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .applet-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    #ggb-element {
      width: 100%;
      /* Use available viewport height instead of a fixed 16:9 ratio. */
      height: calc(100vh - 174px);
      height: calc(100dvh - 174px);
      min-height: 480px;
      border-radius: 12px;
      overflow: hidden;
    }

    footer {
      margin-top: 5px;
      text-align: center;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .note {
      margin-top: 5px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      .page { padding: 8px; }
      h1 { font-size: 1.35rem; }
      #ggb-element { min-height: 500px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <h1>Κατασκευή Τριγώνου</h1>
      <p class="subtitle">
        Με τρεις δοθείσες πλευρές
      </p>
    </header>

    <main class="applet-card">
      <div id="ggb-element"></div>
    </main>

    <p class="note">
      Χρησιμοποίησε μετακίνηση, zoom και το κουμπί επαναφοράς της εφαρμογής.
    </p>

    <footer>
      Δημιουργία: GeoGebra Classic · Φιλοξενία: GitHub Pages
    </footer>
  </div>

  <script>
    const params = {
      appName: "classic",
      showToolBar: false,
      showAlgebraInput: false,
      showMenuBar: false,
      showResetIcon: false,
	  enableRightClick: false,
	  enableLabelDrags: false,
      useBrowserForJS: true,

      appletOnLoad: function (api) {
        api.setPerspective("G");
        api.setCoordSystem(-7, 15, -8, 6);
      },

      filename: "./12_Triangle_Construction.ggb"
    };

    window.addEventListener("load", function () {
      const container = document.getElementById("ggb-element");
      // Match GeoGebra's internal canvas to the CSS-sized container.
      params.width = Math.round(container.clientWidth);
      params.height = Math.round(container.clientHeight);
      const applet = new GGBApplet(params, true);
      applet.inject("ggb-element");
    });
  </script>
</body>
</html>
